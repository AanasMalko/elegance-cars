<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reels | Elegance Cars</title>
<meta name="description" content="Les derniers reels Instagram d'Elegance Cars, showroom automobile à Casablanca.">
<link rel="icon" href="assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
:root{
  --ink:#0a0a09;--panel:#13120f;--line:#2a261c;--text:#ece6d6;--muted:#9d9584;
  --gold-deep:#7f6a2c;--gold:#c3a457;--gold-light:#e8dc8c;
  --gold-grad:linear-gradient(100deg,#7f6a2c 0%,#b8984d 28%,#e8dc8c 52%,#b8984d 74%,#8a7433 100%);
  --body:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,9,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{height:42px;width:auto}
.brand .word{height:14px;width:auto}
.back{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:10px 14px;white-space:nowrap}
.back:hover{color:var(--gold-light);border-color:var(--gold-deep)}
.head{padding-block:48px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{margin:12px 0 0;font-size:clamp(28px,4vw,42px);letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--muted);margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:10px;height:46px;padding-inline:22px;background:var(--gold-grad);color:#14110a;font:600 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase}
.btn:hover{filter:brightness(1.08)}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-bottom:80px;align-items:start}
@media (max-width:1000px){.feed{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.feed{grid-template-columns:1fr}html{scroll-snap-type:y proximity}.reel{scroll-snap-align:start;scroll-margin-top:84px}}
.reel{min-width:0;background:var(--panel);border:1px solid var(--line);padding:10px}
.reel .instagram-media{margin:0!important;min-width:0!important;max-width:100%!important;width:100%!important;border-radius:0!important;box-shadow:none!important}
.reel .fallback{display:grid;place-items:center;gap:14px;aspect-ratio:9/16;max-width:100%;background:radial-gradient(60% 50% at 50% 45%,rgba(195,164,87,.14),transparent 70%);color:var(--muted);text-align:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.reel .fallback img{width:64px;height:auto}
.empty{grid-column:1/-1;border:1px dashed var(--line);padding:40px;text-align:center;color:var(--muted)}
@media (max-width:480px){.brand .word{height:12px}.back{padding:9px 10px;letter-spacing:.12em}}
footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer .wrap{padding-block:28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Accueil Elegance Cars"><img class="mark" src="assets/mark.png" alt=""><img class="word" src="assets/wordmark.png" alt="Elegance Cars"></a>
    <a class="back" href="index.html">← Retour au site</a>
  </div>
</header>
<main class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">Instagram</div>
      <h1>Nos derniers <span class="gold-text">reels</span></h1>
      <div class="sub">Les arrivages du showroom, en vidéo.</div>
    </div>
    <a class="btn" href="https://www.instagram.com/elegancecars.ma/" target="_blank" rel="noopener">Suivre @elegancecars.ma ↗</a>
  </div>
  <div class="feed" id="feed"></div>
</main>
<footer><div class="wrap"><span>© <span id="yr">2026</span> Elegance Cars. Tous droits réservés.</span><a href="index.html">Retour au site</a></div></footer>
<script>
// Les 15 derniers reels, du plus récent au plus ancien. Pour changer une vidéo, remplacez son lien.
var REELS=[
  "https://www.instagram.com/reel/DQCsD4HAvBS/",
  "https://www.instagram.com/reel/DOokMT5AP8i/",
  "https://www.instagram.com/reel/DeaCs5lBUUF/",
  "https://www.instagram.com/reel/DePvjvKBqBk/",
  "https://www.instagram.com/reel/DX7WwP9AQhc/",
  "https://www.instagram.com/reel/DB1vet2uUu3/",
  "https://www.instagram.com/reel/C8z4I0tomgZ/",
  "https://www.instagram.com/reel/C4GYzMkol_4/",
  "https://www.instagram.com/reel/C27zNTIIOMp/",
  "https://www.instagram.com/reel/C2sjmdhL3Pi/",
  "https://www.instagram.com/reel/C17nirGo10b/",
  "https://www.instagram.com/reel/C0PQJTeK4Uk/",
  "https://www.instagram.com/reel/CywJ074rr2W/",
  "https://www.instagram.com/reel/Cwnn1gsrg-o/",
  "https://www.instagram.com/reel/CtmeBbXrZR0/"
];
(function(){
  var feed=document.getElementById("feed");
  if(!REELS.length){feed.innerHTML='<div class="empty">Les reels arrivent bientôt. En attendant, retrouvez-nous sur Instagram.</div>';}
  REELS.forEach(function(url){
    var card=document.createElement("div");card.className="reel";
    var bq=document.createElement("blockquote");bq.className="instagram-media";
    bq.setAttribute("data-instgrm-permalink",url+"?utm_source=ig_embed");bq.setAttribute("data-instgrm-version","14");
    var a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.className="fallback";
    a.innerHTML='<span><img src="assets/mark.png" alt=""><br><br>Voir le reel sur Instagram ↗</span>';
    bq.appendChild(a);card.appendChild(bq);feed.appendChild(card);
  });
  if(REELS.length){var s=document.createElement("script");s.async=true;s.src="https://www.instagram.com/embed.js";document.body.appendChild(s);}
  document.getElementById("yr").textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
